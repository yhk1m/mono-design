<!doctype html>
<html lang="ko" data-tone="mono">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>그래프와 지도</title>
<meta name="description" content="모노 디자인 그래프 7종, 지도 4종 예시">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>
  /* 시연용: 주소 ?tone= ?theme= 이 먼저, 없으면 저장된 선택 */
  (function () {
    var root = document.documentElement, q = new URLSearchParams(location.search), saved = {};
    try { saved.tone = localStorage.getItem('mono-tone'); saved.theme = localStorage.getItem('mono-theme'); } catch (e) {}
    var tone = q.get('tone') || saved.tone, theme = q.get('theme') || saved.theme;
    if (/^(mono|navy|blue)$/.test(tone || '')) root.setAttribute('data-tone', tone);
    if (/^(light|dark)$/.test(theme || '')) root.setAttribute('data-theme', theme);
  })();
</script>
<style>
/* mono.css와 같은 내용 */
/*MONO_CSS*/

/* 예시 페이지 배치 */
.viz-note { margin-top: 12px; font-size: var(--fs-14); color: var(--g5); }
.viz-note code { font-size: var(--fs-13); color: var(--g6); }
.viz-fig { border-top: 1px solid var(--fg); padding-top: 16px; min-width: 0; }
.viz-fig h3 { font-size: var(--fs-18); font-weight: 600; margin-bottom: 4px; }
.viz-fig > p { font-size: var(--fs-14); color: var(--g5); margin-bottom: 16px; }
.viz-fig + .viz-fig { margin-top: 0; }
.m-grid-2 + .m-grid-2 { margin-top: 56px; }
</style>
</head>
<body>

<a class="sr-only" href="#main">본문 바로가기</a>

<header class="m-header">
  <div class="wrap m-header__row">
    <a class="m-brand" href="#">
      <span class="m-brand__name">모노 디자인</span>
      <span class="m-brand__div" aria-hidden="true"></span>
      <span class="m-brand__sub">그래프와 지도</span>
    </a>
    <div class="m-header__tools">
      <!-- 시연용: 실제 페이지에서는 지운다 -->
      <div class="m-tone m-hide-sm" role="group" aria-label="색 테마" data-demo>
        <button type="button" data-tone-btn="mono">흑백</button>
        <button type="button" data-tone-btn="navy">남색</button>
        <button type="button" data-tone-btn="blue">파랑</button>
      </div>
      <button type="button" class="m-iconbtn m-theme-toggle" aria-label="밝게 어둡게 바꾸기">
        <svg class="m-icon i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="m-icon i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main">

  <section class="hero">
    <div class="wrap">
      <span class="m-eyebrow" data-check-contrast="eyebrow">mono-viz.js</span>
      <h1 class="m-hero-title">그래프와 지도</h1>
      <p class="m-lead">흑백이 기본이고 강조색은 짚을 값 하나에만 씁니다. 축은 기준선 하나, 눈금선은 가로로만, 바다는 바탕색입니다. 모든 값은 예시입니다.</p>
    </div>
  </section>

  <section class="section" id="charts">
    <div class="wrap">
      <div class="m-sec-head"><h2 class="m-sec-title">그래프 7종</h2></div>

      <div class="m-grid-2">
        <figure class="viz-fig">
          <h3>세로 막대</h3>
          <p>계열 둘까지 묶음, 누적은 <code>stacked: true</code></p>
          <div id="v-bar"></div>
        </figure>
        <figure class="viz-fig">
          <h3>가로 막대</h3>
          <p>이름이 길거나 항목이 많을 때, 짚을 값 하나만 강조색</p>
          <div id="v-hbar"></div>
        </figure>
      </div>

      <div class="m-grid-2">
        <figure class="viz-fig">
          <h3>꺾은선</h3>
          <p>범례 대신 선 끝에 이름, 강조할 계열 하나</p>
          <div id="v-line"></div>
        </figure>
        <figure class="viz-fig">
          <h3>산점도</h3>
          <p>짚을 점에만 이름, 추세선은 회색 1px</p>
          <div id="v-scatter"></div>
        </figure>
      </div>

      <div class="m-grid-2">
        <figure class="viz-fig">
          <h3>100% 띠</h3>
          <p>원 그래프 대신 씁니다</p>
          <div id="v-share"></div>
        </figure>
        <figure class="viz-fig">
          <h3>기후 그래프</h3>
          <p>강수량은 회색 막대(오른쪽 축), 기온은 선(왼쪽 축)</p>
          <div id="v-climate"></div>
        </figure>
      </div>

      <div class="m-grid-2">
        <figure class="viz-fig">
          <h3>인구 피라미드</h3>
          <p>가장 어린 연령대가 맨 아래</p>
          <div id="v-pyramid"></div>
        </figure>
        <div></div>
      </div>
    </div>
  </section>

  <section class="section section--line" id="maps">
    <div class="wrap">
      <div class="m-sec-head"><h2 class="m-sec-title">지도 4종</h2></div>

      <div class="m-grid-2">
        <figure class="viz-fig">
          <h3>단계 구분도</h3>
          <p>육지 색과 섞은 5단계, 가장 짙은 칸도 80%</p>
          <div id="m-choro"></div>
        </figure>
        <figure class="viz-fig">
          <h3>도형 표현도</h3>
          <p>원의 넓이가 값에 비례, 큰 원부터 그립니다</p>
          <div id="m-symbol"></div>
        </figure>
      </div>

      <div class="m-grid-2">
        <figure class="viz-fig">
          <h3>유선도</h3>
          <p>굵기가 값에 비례하는 곡선과 작은 화살촉</p>
          <div id="m-flow"></div>
        </figure>
        <figure class="viz-fig">
          <h3>위치 안내도</h3>
          <p>짚는 곳만 검게, 확대 상자는 1px 테두리</p>
          <div id="m-locator"></div>
        </figure>
      </div>

      <div class="m-grid-2">
        <figure class="viz-fig">
          <h3>세계 단계 구분도</h3>
          <p>세계 지도는 Equal Earth 도법, 증감은 갈라지는 색</p>
          <div id="m-world"></div>
        </figure>
        <div></div>
      </div>
      <p class="viz-note" data-check-contrast="viz-note">경계: Natural Earth (퍼블릭 도메인)</p>
    </div>
  </section>

</main>

<footer class="m-footer">
  <div class="wrap">
    <p class="m-footer__copy">모노 디자인 그래프와 지도 예시</p>
  </div>
</footer>

<script>
/*MONO_GEO*/
</script>
<script>
/*MONO_VIZ*/
</script>
<script>
(function () {
  var root = document.documentElement;
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function isDark() {
    var t = root.getAttribute('data-theme');
    if (t) return t === 'dark';
    return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  }
  document.querySelectorAll('.m-theme-toggle').forEach(function (b) {
    b.addEventListener('click', function () { var n = isDark() ? 'light' : 'dark'; root.setAttribute('data-theme', n); save('mono-theme', n); });
  });
  function syncTone() {
    var cur = root.getAttribute('data-tone') || 'mono';
    document.querySelectorAll('[data-tone-btn]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-tone-btn') === cur)); });
  }
  document.querySelectorAll('[data-tone-btn]').forEach(function (b) {
    b.addEventListener('click', function () { var t = b.getAttribute('data-tone-btn'); root.setAttribute('data-tone', t); save('mono-tone', t); syncTone(); });
  });
  syncTone();
})();

/* ---------- 그래프 ---------- */
var V = MonoViz;
V.bar('#v-bar', {
  unit: '(단위: 명)',
  labels: ['세계지리', '한국지리', '여행지리', '도시의 미래'],
  series: [{ name: '2025', values: [62, 88, 41, 25] }, { name: '2026', values: [70, 81, 55, 38] }],
  source: '자료: 과목 선택 조사 (예시 값)'
});
V.hbar('#v-hbar', {
  unit: '(단위: %)',
  labels: ['지형', '기후', '인구', '도시', '자원과 산업'],
  values: [72, 58, 81, 66, 49],
  highlight: 4,
  source: '자료: 단원 평가 정답률 (예시 값)'
});
V.line('#v-line', {
  unit: '(단위: %)',
  labels: ['1970', '1980', '1990', '2000', '2010', '2020'],
  series: [
    { name: '한국', values: [41, 57, 74, 80, 82, 81] },
    { name: '일본', values: [72, 76, 77, 79, 91, 92] },
    { name: '중국', values: [17, 19, 26, 36, 49, 61] }
  ],
  highlight: 0,
  source: '자료: 도시 인구 비율 (예시 값)'
});
V.scatter('#v-scatter', {
  unit: '기대 수명(세)',
  xTitle: '1인당 소득(천 달러)',
  points: [
    { x: 2, y: 64 }, { x: 4, y: 68, label: '인도' }, { x: 7, y: 71 }, { x: 10, y: 74 }, { x: 13, y: 78, label: '중국' },
    { x: 18, y: 76 }, { x: 25, y: 80 }, { x: 34, y: 83, label: '한국', highlight: true }, { x: 41, y: 82 },
    { x: 48, y: 81, label: '독일' }, { x: 55, y: 79 }, { x: 70, y: 78, label: '미국' }
  ],
  trend: true,
  source: '자료: 예시 값'
});
V.share('#v-share', {
  parts: ['1차 산업', '2차 산업', '3차 산업'],
  rows: [
    { label: '1970년', values: [50, 20, 30] },
    { label: '1995년', values: [12, 33, 55] },
    { label: '2020년', values: [5, 25, 70] }
  ],
  source: '자료: 산업별 취업자 비율 (예시 값)'
});
V.climate('#v-climate', {
  name: '서울',
  temp: [-2.0, 0.6, 5.8, 12.4, 17.8, 22.0, 25.3, 25.9, 21.2, 14.7, 7.0, 0.0],
  rain: [16.8, 28.2, 36.9, 72.9, 103.6, 129.5, 414.4, 348.2, 141.5, 52.2, 51.1, 22.6],
  source: '자료: 기상청 평년값 1991~2020'
});
V.pyramid('#v-pyramid', {
  unit: '(단위: %)',
  ages: ['0~4', '5~9', '10~14', '15~19', '20~24', '25~29', '30~34', '35~39', '40~44', '45~49', '50~54', '55~59', '60~64', '65~69', '70~74', '75~79', '80~84', '85+'],
  male:   [1.4, 2.0, 2.4, 2.4, 2.9, 3.4, 3.4, 3.4, 4.0, 4.0, 4.3, 4.2, 4.0, 3.0, 2.1, 1.4, 0.9, 0.5],
  female: [1.3, 1.9, 2.2, 2.2, 2.6, 3.0, 3.1, 3.2, 3.8, 3.9, 4.2, 4.2, 4.1, 3.2, 2.4, 1.9, 1.5, 1.3],
  source: '자료: 연령별 인구 구성 (예시 값)'
});

/* ---------- 지도 ---------- */
var KOR = MONO_GEO.korea, WORLD = MONO_GEO.world;
var pop = { '11': 935, '26': 327, '27': 236, '28': 302, '29': 141, '30': 144, '31': 110, '50': 39, '41': 1369, '42': 152, '43': 159, '44': 213, '45': 174, '46': 179, '47': 254, '48': 324, '49': 67 };
V.map('#m-choro', {
  geo: KOR, type: 'choropleth', values: pop, breaks: [100, 150, 250, 500], labels: ['41', '42', '47', '46', '48', '44', '43', '45', '49'],
  unit: '시도별 인구 (단위: 만 명)', source: '자료: 예시 값'
});
V.map('#m-symbol', {
  geo: KOR, type: 'symbol', values: pop,
  unit: '시도별 인구 (단위: 만 명)', source: '자료: 예시 값'
});
V.map('#m-flow', {
  geo: KOR, type: 'flow',
  flows: [
    { from: '26', to: '41', value: 18 }, { from: '27', to: '41', value: 12 }, { from: '29', to: '41', value: 8 },
    { from: '30', to: '41', value: 9 }, { from: '42', to: '41', value: 11 }, { from: '46', to: '29', value: 7, highlight: true }
  ],
  unit: '경기로 옮긴 인구 (단위: 천 명)', source: '자료: 예시 값'
});
V.map('#m-locator', {
  geo: KOR, type: 'locator', focus: '42', labels: ['42'],
  inset: { geo: WORLD, focus: 'KOR', corner: 'br', size: 0.34 },
  unit: '강원의 위치', source: '자료: Natural Earth'
});
V.map('#m-world', {
  geo: WORLD, type: 'choropleth', center: 0, breaks: [-1, 0, 1, 2],
  values: { KOR: -0.1, JPN: -0.5, CHN: 0, IND: 0.9, USA: 0.5, CAN: 0.9, BRA: 0.5, MEX: 0.8, RUS: -0.4, DEU: 0.1, FRA: 0.2, GBR: 0.6, ITA: -0.3, ESP: 0.4, POL: -0.6, UKR: -1.5, NGA: 2.4, ETH: 2.5, EGY: 1.6, ZAF: 0.9, AUS: 1.1, IDN: 0.8, PAK: 1.9, BGD: 1.0, VNM: 0.7, THA: 0.1, TUR: 0.5, IRN: 0.7, SAU: 1.5, ARG: 0.3, COL: 0.6, PER: 1.0, KEN: 2.0, COD: 3.2, TZA: 2.9 },
  unit: '연 인구 증가율 (단위: %)', source: '자료: 예시 값'
});
</script>
</body>
</html>
